name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build without changing the tag
        required: true
        type: string
      verify_signing_only:
        description: Verify configured updater keys without building or publishing a release
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_id:
        description: Existing nightly draft release ID
        required: false
        default: ""
        type: string
      version:
        description: Checkout-only nightly version
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_id && 'nightly' || inputs.release_tag || github.ref_name }}
  NIGHTLY_VERSION: ${{ inputs.version || '' }}
  INPUT_RELEASE_ID: ${{ inputs.release_id || '' }}

concurrency:
  group: release-${{ inputs.release_id && 'nightly' || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-signing:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_signing_only
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify configured keypair and password
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: python3 .github/scripts/verify-updater-signing.py

  prepare:
    if: (inputs.release_id || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !inputs.verify_signing_only
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      signed: ${{ steps.signing.outputs.signed }}
      public_key: ${{ steps.signing.outputs.public_key }}
      commit: ${{ steps.release.outputs.commit }}
      matrix: ${{ steps.release.outputs.matrix }}
      has_builds: ${{ steps.release.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Check tag and version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, tomllib
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          if os.environ['INPUT_RELEASE_ID']:
              assert os.environ['INPUT_RELEASE_ID'].isdigit()
              assert re.fullmatch(re.escape(version) + r'-nightly\.[0-9]{8}\.[0-9]+', os.environ['NIGHTLY_VERSION'])
          else:
              assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', os.environ['RELEASE_TAG'])
              assert os.environ['RELEASE_TAG'] == 'v' + version
          for path in ['package.json', 'package-lock.json', 'src-tauri/tauri.conf.json']:
              assert json.loads(pathlib.Path(path).read_text())['version'] == version, path
          assert tomllib.loads(pathlib.Path('src-tauri/Cargo.toml').read_text())['package']['version'] == version
          packages = tomllib.loads(pathlib.Path('src-tauri/Cargo.lock').read_text())['package']
          assert next(p for p in packages if p['name'] == 'llm-status-board')['version'] == version
          PY
      - name: Determine signed updater availability
        id: signing
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import base64, os
          public = os.environ.get('PUBLIC_KEY', '').strip()
          signed = bool(public and os.environ.get('PRIVATE_KEY', '').strip())
          if signed:
              base64.b64decode(public, validate=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"signed={str(signed).lower()}\n")
              output.write(f"public_key={public if signed else ''}\n")
          print('Updater mode:', 'signed' if signed else 'manual download')
          PY
      - name: Create one draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if os.environ['INPUT_RELEASE_ID']:
              release = json.loads(subprocess.check_output(['gh', 'api', f"repos/{repo}/releases/{os.environ['INPUT_RELEASE_ID']}"]))
              assert release['tag_name'] == 'nightly' and release['draft'] and release['prerelease']
              assert f'<!-- nightly-commit:{commit} -->' in release['body']
          else:
              releases = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases?per_page=100']))
              matches = [release for release in releases if release['tag_name'] == tag]
              assert len(matches) <= 1, 'Duplicate release drafts must be resolved before publishing'
              if matches:
                  release = matches[0]
                  assert release['draft'], 'An existing public release cannot be overwritten'
              else:
                  release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases', '--method', 'POST',
                      '-f', f'tag_name={tag}', '-f', f'name=LLM Status Board {tag}',
                      '-f', 'body=Windows / macOS installers are being verified.', '-F', 'draft=true', '-F', 'prerelease=false']))
          version = os.environ['NIGHTLY_VERSION'] or tag.removeprefix('v')
          assets = {asset['name'] for asset in release['assets'] if asset['state'] == 'uploaded' and asset['size'] > 0}
          signed = os.environ['SIGNED'] == 'true'
          candidates = [
              ('windows-latest', '', [f'LLM.Status.Board_{version}_x64-setup.exe'],
               [f'LLM.Status.Board_{version}_x64-setup.exe.sig']),
              ('macos-latest', '--target aarch64-apple-darwin', [f'LLM.Status.Board_{version}_aarch64.dmg'],
               ['LLM.Status.Board_aarch64.app.tar.gz', 'LLM.Status.Board_aarch64.app.tar.gz.sig']),
              ('macos-15-intel', '--target x86_64-apple-darwin', [f'LLM.Status.Board_{version}_x64.dmg'],
               ['LLM.Status.Board_x64.app.tar.gz', 'LLM.Status.Board_x64.app.tar.gz.sig']),
          ]
          include = [{'platform': platform, 'args': args} for platform, args, installers, updates in candidates
                     if not all(name in assets for name in installers + (updates if signed else []))]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"id={release['id']}\ncommit={commit}\n")
              output.write(f"matrix={json.dumps({'include': include})}\n")
              output.write(f"has_builds={str(bool(include)).lower()}\n")
          print('Remaining builds:', [item['platform'] for item in include])
          PY

  build:
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    env:
      VITE_SIGNED_UPDATER: ${{ needs.prepare.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Configure this fork's release
        id: config
        shell: bash
        env:
          SIGNED: ${{ needs.prepare.outputs.signed }}
          PUBLIC_KEY: ${{ needs.prepare.outputs.public_key }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'release.config.json'
          config = {'bundle': {'createUpdaterArtifacts': os.environ['SIGNED'] == 'true'},
                    'plugins': {'updater': {'pubkey': os.environ['PUBLIC_KEY'],
                    'endpoints': [f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/latest.json"]}}}
          if os.environ['NIGHTLY_VERSION']:
              config['version'] = os.environ['NIGHTLY_VERSION']
          path.write_text(json.dumps(config))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={path.as_posix()}\n')
          PY
      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.signed == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config "${{ steps.config.outputs.path }}"

  publish:
    needs: [prepare, build]
    if: ${{ !inputs.release_id && !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Install updater signature verifier
        if: needs.prepare.outputs.signed == 'true'
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify complete assets, assemble updater manifest and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED_UPDATER: ${{ needs.prepare.outputs.signed }}
          UPDATER_PUBLIC_KEY: ${{ needs.prepare.outputs.public_key }}
        run: python3 .github/scripts/finalize-release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
