name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      signed: ${{ steps.signing.outputs.signed }}
      public_key: ${{ steps.signing.outputs.public_key }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          for path in ['package.json', 'package-lock.json', 'src-tauri/tauri.conf.json']:
              assert json.loads(pathlib.Path(path).read_text())['version'] == version, path
          assert tomllib.loads(pathlib.Path('src-tauri/Cargo.toml').read_text())['package']['version'] == version
          PY
      - name: Determine signed updater availability
        id: signing
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import base64, os
          public = os.environ.get('PUBLIC_KEY', '').strip()
          signed = bool(public and os.environ.get('PRIVATE_KEY', '').strip())
          if signed:
              base64.b64decode(public, validate=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"signed={str(signed).lower()}\n")
              output.write(f"public_key={public if signed else ''}\n")
          print('Updater mode:', 'signed' if signed else 'manual download')
          PY
      - name: Create one draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "LLM Status Board $GITHUB_REF_NAME" --notes-file .github/release-notes.md --draft --verify-tag
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    env:
      VITE_SIGNED_UPDATER: ${{ needs.prepare.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Configure this fork's release
        id: config
        shell: bash
        env:
          SIGNED: ${{ needs.prepare.outputs.signed }}
          PUBLIC_KEY: ${{ needs.prepare.outputs.public_key }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'release.config.json'
          config = {'bundle': {'createUpdaterArtifacts': os.environ['SIGNED'] == 'true'},
                    'plugins': {'updater': {'pubkey': os.environ['PUBLIC_KEY'],
                    'endpoints': [f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/latest.json"]}}}
          path.write_text(json.dumps(config))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={path.as_posix()}\n')
          PY
      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.signed == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }} --config "${{ steps.config.outputs.path }}"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install updater signature verifier
        if: needs.prepare.outputs.signed == 'true'
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify complete assets, assemble updater manifest and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED_UPDATER: ${{ needs.prepare.outputs.signed }}
          UPDATER_PUBLIC_KEY: ${{ needs.prepare.outputs.public_key }}
        run: python3 .github/scripts/finalize-release.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
